name: release

on:
  push:
    branches: [main]

permissions: {}

jobs:
  # Maintain the release PR; on merge, cut the GitHub release + tag.
  release-please:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.rp.outputs.release_created }}
      tag_name: ${{ steps.rp.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v5
        id: rp
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  # Build once; the generated gRPC stubs are git-ignored, so a fresh
  # checkout must regenerate them or the wheel ships broken.
  build:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.x"
      - name: Install build tooling and generate stubs
        run: |
          python -m pip install --upgrade pip build
          pip install -e '.[dev]'
          nox -s proto
      - name: Build sdist + wheel
        run: python -m build
      - name: Validate metadata
        run: |
          pip install twine
          python -m twine check dist/*
      - uses: actions/upload-artifact@v5
        with:
          name: dist
          path: dist/

  publish-pypi:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
