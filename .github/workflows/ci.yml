name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  discover:
    name: discover Python versions
    runs-on: ubuntu-24.04
    outputs:
      versions: ${{ steps.pv.outputs.versions }}
    steps:
      - uses: actions/checkout@v7

      - name: read version specifier from pyproject.toml
        id: range
        shell: bash
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import tomllib
          with open("pyproject.toml", "rb") as fh:
              spec = tomllib.load(fh)["project"]["requires-python"]
          print(f"specifier={spec}")
          PY

      - id: pv
        uses: vicamo/actions-library/python-versions@v1
        with:
          # Single source of truth for the supported range is
          # pyproject.toml's requires-python; the noxfile derives its
          # PYTHON_VERSIONS the same way. Drop EOL series and collapse to
          # the newest patch per X.Y for a compact, current matrix.
          version-range: ${{ steps.range.outputs.specifier }}
          latest-only: 'true'
          exclude-eol: 'true'
          platform: linux
          platform-version: '24.04'
          arch: x64

  test:
    name: nox / py ${{ matrix.python-version }} / ${{ matrix.dependencies }}
    needs: discover
    runs-on: ubuntu-24.04
    env:
      RESOLUTION: ${{ matrix.dependencies == 'minimum' && 'lowest-direct' || 'highest' }}
    strategy:
      fail-fast: false
      matrix:
        python-version: ${{ fromJSON(needs.discover.outputs.versions) }}
        dependencies: [minimum, latest]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: install nox
        run: pip install nox uv

      - name: resolve dependency versions
        run: |
          python - <<'PY' > "$RUNNER_TEMP/build-requirements.txt"
          import tomllib
          with open("pyproject.toml", "rb") as fh:
              project = tomllib.load(fh)
          # Keep unbounded build tools (wheel) at their latest version.
          for requirement in project["build-system"]["requires"]:
              if ">=" in requirement:
                  print(requirement)
          for requirement in project["project"]["optional-dependencies"]["dev"]:
              if requirement.startswith("grpcio-tools"):
                  print(requirement)
          PY
          # Resolve the generator together with runtimes. On newer Python,
          # select the earliest compatible wheels rather than build old C code.
          uv pip compile pyproject.toml "$RUNNER_TEMP/build-requirements.txt" \
            --extra metrics --python-version '${{ matrix.python-version }}' \
            --resolution "$RESOLUTION" --only-binary :all: \
            --output-file "$RUNNER_TEMP/dependency-constraints.txt"
          echo "PIP_CONSTRAINT=$RUNNER_TEMP/dependency-constraints.txt" >> "$GITHUB_ENV"
          echo 'PIP_UPGRADE=1' >> "$GITHUB_ENV"
          python -c 'import sys; print(f"NOX_PYTHON={sys.version_info.major}.{sys.version_info.minor}")' >> "$GITHUB_ENV"

      - name: generate protobuf stubs
        run: nox -s proto

      - name: align protobuf runtime with generated bindings
        run: |
          # grpcio-tools metadata can permit a runtime older than its gencode.
          python - <<'PY' >> "$RUNNER_TEMP/build-requirements.txt"
          import re
          from pathlib import Path
          versions = []
          for path in Path("src/forgejo_lxd_runner/proto").rglob("*_pb2.py"):
              match = re.search(r"^# Protobuf Python Version: (\d+\.\d+\.\d+)$", path.read_text(), re.MULTILINE)
              if match:
                  versions.append(tuple(map(int, match[1].split("."))))
          # Older generators have no version header or runtime version check.
          if versions:
              print("protobuf>=" + ".".join(map(str, max(versions))))
          PY
          uv pip compile pyproject.toml "$RUNNER_TEMP/build-requirements.txt" \
            --extra metrics --python-version '${{ matrix.python-version }}' \
            --resolution "$RESOLUTION" --only-binary :all: \
            --output-file "$PIP_CONSTRAINT"

      - name: lint
        if: matrix.dependencies == 'latest'
        run: nox -s lint

      - name: type-check
        if: matrix.dependencies == 'latest'
        run: nox -s type

      - name: unit tests
        run: nox -s "tests-$NOX_PYTHON"

  e2e:
    name: ${{ format('e2e / {0} {1}', matrix.backend, matrix.version) }}
    needs: discover
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - backend: lxd
            version: 5.21/stable
          - backend: lxd
            version: latest/stable
          # It takes incus >= 6.19 to include the fix for
          # https://github.com/opencontainers/runc/issues/4968
          - backend: incus
            version: lts-7.0
    steps:
      - uses: actions/checkout@v7

      - name: set up a single-node LXD cluster
        if: matrix.backend == 'lxd'
        uses: canonical/setup-lxd@v1
        with:
          channel: ${{ matrix.version }}
          # A preseed with cluster.enabled turns the bootstrap node into a
          # one-member cluster. That is enough to exercise ?target=
          # placement end to end: a valid member name succeeds and the
          # instance reports its location; an unknown name is refused.
          # core.https_address must be a real address for clustering;
          # 127.0.0.1 keeps it host-local on the ephemeral runner.
          preseed: |
            config:
              core.https_address: 127.0.0.1:8443
            cluster:
              server_name: node1
              enabled: true
            networks:
              - name: lxdbr0
                type: bridge
                config:
                  ipv4.address: auto
                  ipv6.address: none
            storage_pools:
              - name: default
                driver: dir
            profiles:
              - name: default
                devices:
                  root:
                    path: /
                    pool: default
                    type: disk
                  eth0:
                    name: eth0
                    network: lxdbr0
                    type: nic

      - name: relax LXD socket permissions
        if: matrix.backend == 'lxd'
        # setup-lxd adds the runner user to the `lxd` group, but the
        # supplementary group only takes effect on next login — the
        # pytest process in this same job would still hit EACCES on
        # the socket. World-writable is safe here (ephemeral runner).
        run: |
          for sock in \
            /var/snap/lxd/common/lxd/unix.socket \
            /var/lib/lxd/unix.socket; do
            if [ -S "$sock" ]; then sudo chmod 0666 "$sock"; fi
          done

      - name: set up Zabbly package repository
        if: matrix.backend == 'incus'
        run: |
          sudo curl -fsSL https://pkgs.zabbly.com/key.asc -o /etc/apt/keyrings/zabbly.asc
          cat /etc/apt/keyrings/zabbly.asc | gpg --show-keys --fingerprint | \
              grep '4EFC 5906 96CB 15B8 7C73  A3AD 82CC 8797 C838 DCFD'

          sudo sh -c 'cat <<EOF > /etc/apt/sources.list.d/zabbly-incus-${{ matrix.version }}.sources
          Enabled: yes
          Types: deb
          URIs: https://pkgs.zabbly.com/incus/${{ matrix.version }}
          Suites: $(. /etc/os-release && echo ${VERSION_CODENAME})
          Components: main
          Architectures: $(dpkg --print-architecture)
          Signed-By: /etc/apt/keyrings/zabbly.asc

          EOF'

      - name: set up Incus
        if: matrix.backend == 'incus'
        run: |
          sudo apt-get update
          sudo apt-get install -y incus qemu-utils qemu-system
          sudo incus admin init --auto
          # Client autodetects the socket by walking a fixed list; make
          # the Incus socket world-accessible so the tests can reach it
          # without sudo. Group membership would need a re-login to take
          # effect within the same job.
          sudo chmod 0666 /var/lib/incus/unix.socket

      - name: allow instance egress off the daemon bridge
        # The hosted runner ships Docker, which sets the iptables FORWARD
        # policy to DROP. That applies to every bridge, so traffic
        # forwarded off an instance bridge toward the internet is dropped
        # and instances cannot reach the package mirrors. The rule has to
        # live in the FORWARD chain itself: an ACCEPT in DOCKER-USER only
        # returns to FORWARD, which then falls through to the DROP policy,
        # so it never unblocks a non-docker bridge. Insert at the head of
        # FORWARD, ahead of Docker's own jumps, where an explicit ACCEPT
        # terminates traversal before the DROP.
        #
        # Two bridge patterns need it: the daemon's own bridge, which the
        # egress probe and simple jobs ride, and the per-job `flr-*`
        # bridges the server creates for isolation (one per job, named
        # `flr-<hex>`). The `+` is iptables' interface wildcard, so
        # `flr-+` matches every per-job bridge at once.
        run: |
          bridge=${{ matrix.backend == 'lxd' && 'lxdbr0' || 'incusbr0' }}
          for iface in "$bridge" "flr-+"; do
            sudo iptables -I FORWARD -i "$iface" -j ACCEPT
            sudo iptables -I FORWARD -o "$iface" -j ACCEPT
          done

      - uses: actions/setup-python@v7
        with:
          # e2e only needs one interpreter; pick the newest we support.
          python-version: ${{ fromJSON(needs.discover.outputs.versions)[0] }}

      - name: install nox
        run: pip install nox

      - name: generate protobuf stubs
        run: nox -s proto

      - name: e2e against a live ${{ matrix.backend }} daemon
        run: nox -s e2e
        env:
          # Tell the tests which daemon *should* have been autodetected,
          # so they can verify the autodetect list is ordered correctly.
          # The socket path itself is intentionally left unset — the
          # client must find it on its own.
          FORGEJO_LXD_RUNNER_E2E_BACKEND: ${{ matrix.backend }}
